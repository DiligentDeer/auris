<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>Verb Flashcards</title>
<style>
  :root{
    --sans:"Helvetica Neue",Arial,"Segoe UI",Roboto,sans-serif;
    --ink:#000;
    --line:#8a8a8a;
    --faint:#d8d8d8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#fff;color:var(--ink);
            overscroll-behavior:none;overflow:hidden}
  body{font-family:var(--sans);
       display:flex;flex-direction:column;align-items:center;
       padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 10px);
       -webkit-user-select:none;user-select:none}

  /* progress */
  .top{width:100%;max-width:430px;flex:0 0 auto}
  .count{font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:700;
         display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
  .count .of{font-weight:400;color:var(--line)}
  .count .back{color:var(--ink);text-decoration:none;margin-right:14px}
  .count .back:active{color:var(--line)}
  .bar{height:1px;background:var(--faint);position:relative}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);
         transition:width .2s ease-out}

  /* card stage */
  .stage{flex:1 1 auto;width:100%;max-width:430px;display:flex;align-items:center;
         justify-content:center;min-height:0;padding:12px 0}
  .card{width:100%;border:1px solid var(--line);background:#fff;position:relative;
        padding:18px 46px 16px 18px;touch-action:pan-y;will-change:transform,opacity}

  /* the star that keeps a card, top right, inside the card */
  .fav{position:absolute;top:0;right:0;width:44px;height:44px;padding:0;margin:0;
       border:0;background:none;color:var(--ink);cursor:pointer;
       display:flex;align-items:center;justify-content:center}
  .fav:active{background:none;color:var(--ink)}

  .fam{font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
       color:var(--line);margin:0 0 8px}
  .fam::before{content:"\2756";margin-right:7px;font-weight:400}
  .v{font-size:30px;font-weight:700;line-height:1.05;letter-spacing:-.3px;margin:0}
  .mn{font-style:italic;font-size:15px;margin:3px 0 0}

  .sec{font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
       margin:16px 0 6px;padding-top:9px;border-top:1px solid var(--faint)}

  .conj{display:grid;grid-template-columns:auto 1fr;column-gap:14px;row-gap:5px;margin:0}
  .conj dt{font-size:13px;color:#555;text-align:right;white-space:nowrap}
  .conj dd{font-size:17px;margin:0;font-variant-numeric:tabular-nums}

  .pair{display:grid;grid-template-columns:auto 1fr;column-gap:14px;row-gap:5px}
  .pair dt{font-size:13px;color:#555;text-align:right;white-space:nowrap}
  .pair dd{font-size:17px;margin:0}
  .tail{display:block;font-size:11px;font-style:italic;color:#666;margin-top:2px}

  @media (min-height:760px){
    .v{font-size:36px}
    .conj dd,.pair dd{font-size:19px}
  }

  /* controls */
  .ctl{flex:0 0 auto;display:flex;align-items:center;gap:14px;width:100%;max-width:430px;
       justify-content:center}
  button{font-family:var(--sans);font-size:22px;line-height:1;color:var(--ink);
         background:#fff;border:1px solid var(--line);
         width:64px;height:44px;cursor:pointer;padding:0}
  button:active{background:var(--ink);color:#fff}
  button:disabled{color:var(--faint);border-color:var(--faint);cursor:default}
  button:disabled:active{background:#fff;color:var(--faint)}
  #favonly{display:flex;align-items:center;justify-content:center}
  #favonly.on,#favonly.on:active{background:var(--ink);color:#fff}
  .hint{font-size:10.5px;color:var(--line);text-align:center;margin:7px 0 0;
        flex:0 0 auto;letter-spacing:.3px}

  @media (min-height:760px){
    .card{padding:24px 50px 20px 22px}
  }
</style>
</head>
<body>

<div class="top">
  <div class="count"><span><a class="back" href="index.html">&#8249; Index</a><span id="n">1</span></span><span class="of">of <span id="total"></span> &middot; <span id="mode">shuffled</span></span></div>
  <div class="bar"><i id="fill"></i></div>
</div>

<div class="stage"><div class="card" id="card"></div></div>

<div class="ctl">
  <button id="prev" aria-label="Previous card">&#8249;</button>
  <button id="next" aria-label="Next card">&#8250;</button>
  <button id="favonly" aria-label="Show kept cards only" aria-pressed="false"></button>
</div>
<p class="hint">Swipe the card, or use the arrow keys &middot; star keeps a card &middot; the last button shows kept cards only</p>

},{"k":"tenir","v":"tenir","m":"to hold","f":"Venir family","p":["tiens","tiens","tient","tenons","tenez","tie<b>nn</b>ent"],"pc":"ai tenu","im":"ten-"},{"k":"obtenir","v":"obtenir","m":"to get, to obtain","f":"Venir family","p":["obtiens","obtiens","obtient","obtenons","obtenez","obtie<b>nn</b>ent"],"pc":"ai obtenu","im":"obten-"},{"k":"appartenir","v":"appartenir","m":"to belong","f":"Venir family","p":["appartiens","appartiens","appartient","appartenons","appartenez","appartie<b>nn</b>ent"],"pc":"ai appartenu","im":"apparten-"},{"k":"retenir","v":"retenir","m":"to hold back, to remember","f":"Venir family","p":["retiens","retiens","retient","retenons","retenez","retie<b>nn</b>ent"],"pc":"ai retenu","im":"reten-"},{"k":"soutenir","v":"soutenir","m":"to support","f":"Venir family","p":["soutiens","soutiens","soutient","soutenons","soutenez","soutie<b>nn</b>ent"],"pc":"ai soutenu","im":"souten-"},{"k":"contenir","v":"contenir","m":"to contain","f":"Venir family","p":["contiens","contiens","contient","contenons","contenez","contie<b>nn</b>ent"],"pc":"ai contenu","im":"conten-"},{"k":"maintenir","v":"maintenir","m":"to maintain","f":"Venir family","p":["maintiens","maintiens","maintient","maintenons","maintenez","maintie<b>nn</b>ent"],"pc":"ai maintenu","im":"mainten-"},{"k":"connaître","v":"connaître","m":"to know (a person, a place)","f":"-aître family","p":["connais","connais","conna<b>î</b>t","connaissons","connaissez","connaissent"],"pc":"ai connu","im":"connaiss-"},{"k":"reconnaître","v":"reconnaître","m":"to recognise","f":"-aître family","p":["reconnais","reconnais","reconna<b>î</b>t","reconnaissons","reconnaissez","reconnaissent"],"pc":"ai reconnu","im":"reconnaiss-"},{"k":"paraître","v":"paraître","m":"to seem, to appear","f":"-aître family","p":["parais","parais","para<b>î</b>t","paraissons","paraissez","paraissent"],"pc":"ai paru","im":"paraiss-"},{"k":"apparaître","v":"apparaître","m":"to appear","f":"-aître family","p":["apparais","apparais","appara<b>î</b>t","apparaissons","apparaissez","apparaissent"],"pc":"suis apparu(e)","im":"apparaiss-"},{"k":"disparaître","v":"disparaître","m":"to disappear","f":"-aître family","p":["disparais","disparais","dispara<b>î</b>t","disparaissons","disparaissez","disparaissent"],"pc":"ai disparu","im":"disparaiss-"},{"k":"naître","v":"naître","m":"to be born","f":"-aître family","p":["nais","nais","na<b>î</b>t","naissons","naissez","naissent"],"pc":"suis né(e)","im":"naiss-"},{"k":"être","v":"être","m":"to be","f":"Irregular","p":["suis","es","est","sommes","êtes","sont"],"pc":"ai été","im":"<b>ét-</b>"},{"k":"avoir","v":"avoir","m":"to have","f":"Irregular","p":["ai","as","a","avons","avez","ont"],"pc":"ai eu","im":"av-"},{"k":"faire","v":"faire","m":"to do, to make","f":"Irregular","p":["fais","fais","fait","faisons","<b>faites</b>","<b>font</b>"],"pc":"ai fait","im":"fais-"},{"k":"refaire","v":"refaire","m":"to redo","f":"Irregular","p":["refais","refais","refait","refaisons","<b>refaites</b>","<b>refont</b>"],"pc":"ai refait","im":"refais-"},{"k":"aller","v":"aller","m":"to go","f":"Irregular","p":["vais","vas","va","allons","allez","vont"],"pc":"suis allé(e)","im":"all-"},{"k":"falloir","v":"falloir","m":"to be necessary","f":"Irregular","p":["—","—","faut","—","—","—"],"pc":"a fallu","im":"fall-"},{"k":"pleuvoir","v":"pleuvoir","m":"to rain","f":"Irregular","p":["—","—","pleut","—","—","—"],"pc":"a plu","im":"pleuv-"},{"k":"courir","v":"courir","m":"to run","f":"Irregular","p":["cours","cours","court","courons","courez","courent"],"pc":"ai couru","im":"cour-"},{"k":"mourir","v":"mourir","m":"to die","f":"Irregular","p":["meurs","meurs","meurt","mourons","mourez","meurent"],"pc":"suis mort(e)","im":"mour-"},{"k":"fuir","v":"fuir","m":"to flee","f":"Irregular","p":["fuis","fuis","fuit","fuyons","fuyez","fuient"],"pc":"ai fui","im":"fuy-"},{"k":"s'enfuir","v":"s'enfuir","m":"to run away","f":"Irregular","p":["m'enfuis","t'enfuis","s'enfuit","nous enfuyons","vous enfuyez","s'enfuient"],"pc":"me suis enfui(e)","im":"enfuy-"},{"k":"résoudre","v":"résoudre","m":"to solve","f":"Irregular","p":["résous","résous","résout","résolvons","résolvez","résolvent"],"pc":"ai résolu","im":"résolv-"},{"k":"convaincre","v":"convaincre","m":"to convince","f":"Irregular","p":["convaincs","convaincs","convainc","convainquons","convainquez","convainquent"],"pc":"ai convaincu","im":"convainqu-"},{"k":"acquérir","v":"acquérir","m":"to acquire","f":"Irregular","p":["acquiers","acquiers","acquiert","acquérons","acquérez","acquièrent"],"pc":"ai acquis","im":"acquér-"}];
const ALL   = CARDS.length;

const card     = document.getElementById('card');
const nEl      = document.getElementById('n');
const totalEl  = document.getElementById('total');
const modeEl   = document.getElementById('mode');
const fill     = document.getElementById('fill');
const prevB    = document.getElementById('prev');
const favOnlyB = document.getElementById('favonly');

/* ---- the star, one path, drawn in currentColor ---- */
const STAR_D = 'M12 2.7l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5-5.8-3-5.8 3 1.1-6.5-4.7-4.6 6.5-.9z';
function starSVG(on){
  return '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
         '<path d="' + STAR_D + '" ' +
         (on ? 'fill="currentColor"'
             : 'fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"') +
         '/></svg>';
}

/* ---- kept cards ---- */
const FAV_KEY = 'fav:verbs';
let favs = new Set();
try {
  const raw = localStorage.getItem(FAV_KEY);
  if (raw){
    const a = JSON.parse(raw);
    if (Array.isArray(a)) favs = new Set(a);
  }
} catch (err) { /* storage unavailable: the session still works */ }

function saveFavs(){
  try { localStorage.setItem(FAV_KEY, JSON.stringify([...favs])); }
  catch (err) { /* storage unavailable: the session still works */ }
}

const favBtn = document.createElement('button');
favBtn.className = 'fav';
favBtn.type = 'button';
favBtn.setAttribute('aria-label', 'Keep this card');
favBtn.innerHTML = starSVG(false);

/* ---- shuffled bag: every card appears once before any repeats ---- */
let favOnly = false;
let pool = [], poolN = 0;
let bag = [], stream = [], pos = 0, busy = false;

function setPool(){
  pool = [];
  for (let i = 0; i < ALL; i++){
    if (!favOnly || favs.has(CARDS[i].k)) pool.push(i);
  }
  poolN = pool.length;
  totalEl.textContent = poolN;
  modeEl.textContent = favOnly ? 'favourites' : 'shuffled';
}

function refill(avoid){
  const b = pool.slice();
  for (let i = b.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  // never repeat a card back-to-back across a bag boundary
  if (avoid !== undefined && b.length > 1 && b[0] === avoid) [b[0], b[b.length-1]] = [b[b.length-1], b[0]];
  bag = b;
}

function draw(){
  if (!bag.length) refill(stream.length ? stream[stream.length-1].i : undefined);
  const i = bag.shift();
  return { i, n: poolN - bag.length };
}

function advance(dir){
  if (dir > 0){
    pos++;
    if (pos === stream.length) stream.push(draw());
  } else if (pos > 0){
    pos--;
  }
}

/* ---- render ---- */
function paintStar(){
  const on = favs.has(CARDS[stream[pos].i].k);
  favBtn.innerHTML = starSVG(on);
  favBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
}

function render(){
  const e = stream[pos], c = CARDS[e.i];
  const PRON = ["je","tu","il/elle","nous","vous","ils/elles"];
  const IMPF_RULE = "+ -ais · -ais · -ait · -ions · -iez · -aient";
  const elides = s => /^[aeiouéèêàâîôûh]/i.test(s.replace(/<[^>]+>/g, ''));
  const rows = c.p.map((form, k) => {
    const label = (k === 0 && elides(form)) ? "j&rsquo;" : PRON[k];
    return `<dt>${label}</dt><dd>${form}</dd>`;
  }).join('');

  card.innerHTML =
    `<p class="fam">${c.f}</p>` +
    `<p class="v">${c.v}</p>` +
    `<p class="mn">${c.m}</p>` +
    `<p class="sec">Pr&eacute;sent</p>` +
    `<dl class="conj">${rows}</dl>` +
    `<p class="sec">Pass&eacute; compos&eacute; &middot; Imparfait</p>` +
    `<dl class="pair">` +
      `<dt>p.c.</dt><dd>${c.pc}</dd>` +
      `<dt>impf.</dt><dd>${c.im}<span class="tail">${IMPF_RULE}</span></dd>` +
    `</dl>`;
  card.appendChild(favBtn);
  paintStar();

  nEl.textContent = e.n;
  fill.style.width = (e.n / Math.max(1, poolN) * 100).toFixed(1) + '%';
  prevB.disabled = pos === 0;
}

/* ---- keeping and showing kept cards ---- */
function syncFavOnlyB(){
  favOnlyB.disabled = favs.size === 0;
}

function setFavOnly(on){
  favOnly = on;
  favOnlyB.classList.toggle('on', on);
  favOnlyB.setAttribute('aria-pressed', on ? 'true' : 'false');
  setPool();
  bag = []; stream = []; pos = 0;
  refill();
  stream.push(draw());
  render();
}

function toggleFav(){
  if (busy || !stream.length) return;
  const k = CARDS[stream[pos].i].k;
  if (favs.has(k)) favs.delete(k); else favs.add(k);
  saveFavs();
  paintStar();
  syncFavOnlyB();
  if (favOnly){
    if (!favs.size){
      favOnly = false;
      favOnlyB.classList.remove('on');
      favOnlyB.setAttribute('aria-pressed', 'false');
    }
    // the card on screen stays; the next draw comes from the new pool
    setPool();
    refill(stream[pos].i);
  }
}

favBtn.addEventListener('touchstart', e => { e.stopPropagation(); }, {passive:true});
favBtn.addEventListener('click', e => { e.stopPropagation(); toggleFav(); });

/* ---- transitions ---- */
function go(dir){
  if (busy) return;
  if (dir < 0 && pos === 0) return;
  busy = true;
  const W = window.innerWidth;
  card.style.transition = 'transform .17s ease-in, opacity .17s ease-in';
  card.style.transform  = `translateX(${-dir * W}px) rotate(${-dir * 4}deg)`;
  card.style.opacity    = '0';
  setTimeout(() => {
    advance(dir);
    render();
    card.style.transition = 'none';
    card.style.transform  = `translateX(${dir * W * 0.3}px)`;
    card.style.opacity    = '0';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      card.style.transition = 'transform .19s ease-out, opacity .19s ease-out';
      card.style.transform  = 'none';
      card.style.opacity    = '1';
      setTimeout(() => { busy = false; }, 190);
    }));
  }, 170);
}

function settle(){
  card.style.transition = 'transform .18s ease-out, opacity .18s ease-out';
  card.style.transform  = 'none';
  card.style.opacity    = '1';
}

/* ---- swipe ---- */
let x0 = 0, y0 = 0, dx = 0, axis = null, down = false;
const THRESH = 55;

card.addEventListener('touchstart', e => {
  if (busy || e.touches.length !== 1) return;
  down = true; axis = null; dx = 0;
  x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  card.style.transition = 'none';
}, {passive:true});

card.addEventListener('touchmove', e => {
  if (!down) return;
  const ax = e.touches[0].clientX - x0;
  const ay = e.touches[0].clientY - y0;
  if (axis === null){
    if (Math.abs(ax) < 6 && Math.abs(ay) < 6) return;
    axis = Math.abs(ax) > Math.abs(ay) ? 'x' : 'y';
  }
  if (axis !== 'x'){ down = false; settle(); return; }
  e.preventDefault();
  dx = ax;
  if (pos === 0 && dx > 0) dx *= 0.3;          // resistance at the start of history
  card.style.transform = `translateX(${dx}px) rotate(${dx / 26}deg)`;
  card.style.opacity   = String(Math.max(0.35, 1 - Math.abs(dx) / 380));
}, {passive:false});

function release(){
  if (!down) return;
  down = false;
  if (axis === 'x' && Math.abs(dx) > THRESH) go(dx < 0 ? 1 : -1);
  else settle();
  dx = 0;
}
card.addEventListener('touchend', release);
card.addEventListener('touchcancel', release);

/* ---- buttons & keys ---- */
document.getElementById('next').addEventListener('click', () => go(1));
prevB.addEventListener('click', () => go(-1));
favOnlyB.innerHTML = starSVG(true);
favOnlyB.addEventListener('click', () => {
  if (favOnlyB.disabled) return;
  setFavOnly(!favOnly);
});
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(1); }
  if (e.key === 'ArrowLeft')                   { e.preventDefault(); go(-1); }
  if (e.key === 'f' || e.key === 'F')          { e.preventDefault(); toggleFav(); }
});

/* stop the page itself from rubber-banding on iOS */
document.addEventListener('touchmove', e => {
  if (down && axis === 'x') e.preventDefault();
}, {passive:false});

/* ---- boot ---- */
syncFavOnlyB();
setPool();
refill();
stream.push(draw());
render();
</script>
