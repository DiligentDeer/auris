  :root{
    --mono:"Plex Mono",ui-monospace,Menlo,monospace;
    --ink:#000;--line:#8a8a8a;--faint:#d8d8d8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#fff;color:var(--ink)}
  body{font-family:var(--mono);font-size:14px;-webkit-user-select:none;user-select:none}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  button:focus-visible,a:focus-visible{outline:1px solid #000;outline-offset:-3px}
  a{color:inherit;text-decoration:none}

  .splash{position:fixed;inset:0;background:#fff;display:grid;place-items:center;z-index:50;
          font-weight:100;font-size:34px;letter-spacing:1px;
          transition:transform .6s cubic-bezier(.65,0,.35,1)}
  .splash.up{transform:translateY(-100%)}
  .splash[hidden]{display:none}
  @media (prefers-reduced-motion:reduce){.splash{transition:opacity .3s}.splash.up{transform:none;opacity:0}}

  .tree{max-width:480px;margin:0 auto;padding:0 0 calc(env(safe-area-inset-bottom) + 48px)}
  .head{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 16px 14px;font-weight:100;font-size:28px;letter-spacing:.5px;line-height:1}
  .row{display:flex;align-items:center;min-height:28px;padding:0 4px 0 16px;width:100%;text-align:left}
  .pm{flex:none;width:2ch;color:var(--line)}
  .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:28px}
  .kids{display:none}
  .open>.kids{display:block}
  .gc{flex:none;width:2ch;align-self:stretch;position:relative}
  .gc.pipe::before,.gc.tee::before,.gc.end::before{content:"";position:absolute;left:calc(1ch - .5px);top:0;bottom:0;border-left:1px solid var(--faint)}
  .gc.end::before{bottom:50%}
  .gc.tee::after,.gc.end::after{content:"";position:absolute;left:1ch;right:3px;top:50%;border-top:1px solid var(--faint)}
  .tg{flex:none;width:44px;height:28px;font-size:13px;color:var(--line)}
  .tg::before{content:"[ ]"}
  .tg[aria-pressed=true]::before{content:"[x]";color:#000}
  .file.read .nm{color:var(--line)}
  .empty{color:var(--faint)}
</style>
</head>

let READ = {};
try { READ = JSON.parse(localStorage.getItem('auris:read') || '{}'); } catch (e) {}
function saveRead(){ try { localStorage.setItem('auris:read', JSON.stringify(READ)); } catch (e) {} }
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

/* a folder shows + or -, a file links to its page and has a read toggle.
   Top level folders start open, deeper folders start closed.
   Guides: each depth adds one column, a pipe where the parent has later siblings */
function treeHTML(nodes, depth, lead){
  return nodes.map((n, i) => {
    const last = i === nodes.length - 1;
    const g = depth ? lead.map(x => `<i class="gc ${x}"></i>`).join('') + `<i class="gc ${last ? 'end' : 'tee'}"></i>` : '';
    const kidLead = depth ? [...lead, last ? 'blank' : 'pipe'] : [];
    if (n.k){
      const kids = n.k.length ? treeHTML(n.k, depth + 1, kidLead)
                              : `<div class="row empty">${[...kidLead].map(x => `<i class="gc ${x}"></i>`).join('')}<i class="gc end"></i><span class="nm">empty</span></div>`;
      const open = depth === 0;
      return `<div class="node${open ? ' open' : ''}"><button class="row frow" aria-expanded="${open}">${g}<span class="pm">${open ? '-' : '+'}</span><span class="nm">${esc(n.d)}</span></button>`
           + `<div class="kids">${kids}</div></div>`;
    }
    return `<div class="row file" data-id="${esc(n.id)}">${g}<a class="nm" href="${esc(n.href)}">${esc(n.f)}</a>`
         + `<button class="tg" data-id="${esc(n.id)}" aria-label="Read" aria-pressed="false"></button></div>`;
  }).join('');
}
const tree = document.getElementById('tree');
tree.innerHTML = treeHTML(TREE, 0, []);

function syncRead(){
  tree.querySelectorAll('.tg').forEach(t => t.setAttribute('aria-pressed', READ[t.dataset.id] ? 'true' : 'false'));
  tree.querySelectorAll('.file').forEach(f => f.classList.toggle('read', !!READ[f.dataset.id]));
}
tree.addEventListener('click', e => {
  const tg = e.target.closest('.tg');
  if (tg){
    const id = tg.dataset.id;
    if (READ[id]) delete READ[id]; else READ[id] = 1;
    saveRead(); syncRead(); return;
  }
  const fr = e.target.closest('.frow');
  if (fr){
    const node = fr.parentElement, on = !node.classList.contains('open');
    node.classList.toggle('open', on);
    fr.setAttribute('aria-expanded', on);
    fr.querySelector('.pm').textContent = on ? '-' : '+';
  }
});
syncRead();

/* the landing plays once per browser session */
const splash = document.getElementById('splash');
let seen = false;
try { seen = sessionStorage.getItem('auris:splash') === '1'; sessionStorage.setItem('auris:splash', '1'); } catch (e) {}
if (!seen){
  splash.hidden = false;
  setTimeout(() => splash.classList.add('up'), 1000);
  splash.addEventListener('transitionend', () => { splash.hidden = true; });
}
</script>
